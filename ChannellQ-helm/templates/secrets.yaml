apiVersion: v1
kind: Secret
metadata:
  name: {{ include "channellq.fullname" . }}-secrets
  namespace: {{ include "channellq.namespace" . }}
  labels:
    {{- include "channellq.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database URLs
  DATABASE_URL_AUTH: {{ .Values.secrets.databases.auth | quote }}
  DATABASE_URL_USER: {{ .Values.secrets.databases.user | quote }}
  DATABASE_URL_CHAT: {{ .Values.secrets.databases.chat | quote }}
  DATABASE_URL_MEETING: {{ .Values.secrets.databases.meeting | quote }}
  
  # JWT Secret
  JWT_SECRET: {{ .Values.secrets.jwt | quote }}
  
  # Email Credentials
  EMAIL_USER: {{ .Values.secrets.email.user | quote }}
  EMAIL_PASS: {{ .Values.secrets.email.password | quote }}
  
  # Kafka Credentials
  KAFKA_USERNAME: {{ .Values.secrets.kafka.username | quote }}
  KAFKA_PASSWORD: {{ .Values.secrets.kafka.password | quote }}
  
  # Redis Password
  REDIS_PASSWORD: {{ .Values.secrets.redis.password | quote }}
  
  # Supabase Credentials
  SUPABASE_URL: {{ .Values.secrets.supabase.url | quote }}
  SUPABASE_ANON_KEY: {{ .Values.secrets.supabase.anonKey | quote }}
  SUPABASE_SERVICE_ROLE_KEY: {{ .Values.secrets.supabase.serviceRoleKey | quote }}
  
  # LiveKit Credentials
  LIVEKIT_API_KEY: {{ .Values.secrets.livekit.apiKey | quote }}
  LIVEKIT_API_SECRET: {{ .Values.secrets.livekit.apiSecret | quote }}
  LIVEKIT_WS_URL: {{ .Values.secrets.livekit.wsUrl | quote }}