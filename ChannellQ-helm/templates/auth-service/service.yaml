{{- if .Values.services.auth.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: {{ include "channellq.namespace" . }}
  labels:
    {{- include "channellq.labels" . | nindent 4 }}
    app: auth-service
  {{- if .Values.monitoring.prometheus.enabled }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.services.auth.port | quote }}
    prometheus.io/path: {{ .Values.monitoring.prometheus.metricsPath | quote }}
  {{- end }}
spec:
  selector:
    app: auth-service
  ports:
    - port: {{ .Values.services.auth.port }}
      targetPort: {{ .Values.services.auth.port }}
      protocol: TCP
      name: http
  type: ClusterIP
{{- end }}