name: ChannelIQ Build and Push

on:
  push:
    branches: [Main, main, dev]
    paths:
      - "services/**"
      - ".github/workflows/ci-cd.yml"

env:
  DOCKER_REGISTRY: ravencraft568

jobs:
  validate-docker-secrets:
    name: Validate Docker Hub Secrets
    runs-on: ubuntu-latest
    outputs:
      docker-ready: ${{ steps.check.outputs.docker-ready }}
    steps:
      - name: Check required secrets
        id: check
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "::warning::Missing DOCKER_USERNAME or DOCKER_PASSWORD in GitHub repository secrets."
            echo "::warning::Go to Settings -> Secrets and variables -> Actions, then add both secrets."
            echo "docker-ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "docker-ready=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build and Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: validate-docker-secrets
    if: needs.validate-docker-secrets.outputs.docker-ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-management-service
          - chat-service
          - media-service
          - meeting-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image
        run: echo "Pushed ${{ env.DOCKER_REGISTRY }}/${{ matrix.service }}:latest"
