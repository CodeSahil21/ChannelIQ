apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: corporatechat
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ravencraft568/auth-service:v27
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: NODE_ENV
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: corporate-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: corporate-secrets
                  key: DATABASE_URL_AUTH
            - name: KAFKA_CLIENT_ID
              value: "auth-service"
            - name: KAFKA_CONSUMER_GROUP_ID
              value: "auth-service-group"
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: KAFKA_BROKER
            - name: KAFKA_USE_SSL
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: KAFKA_USE_SSL
            - name: KAFKA_SSL_CA_PATH
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: KAFKA_SSL_CA_PATH
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: corporate-secrets
                  key: KAFKA_USERNAME
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: corporate-secrets
                  key: KAFKA_PASSWORD
            - name: KAFKA_REPLICATION_FACTOR
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: KAFKA_REPLICATION_FACTOR
            - name: KAFKA_USER_EVENTS_PARTITIONS
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: KAFKA_USER_EVENTS_PARTITIONS
            - name: KAFKA_CHAT_EVENTS_PARTITIONS
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: KAFKA_CHAT_EVENTS_PARTITIONS
            - name: KAFKA_MEDIA_EVENTS_PARTITIONS
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: KAFKA_MEDIA_EVENTS_PARTITIONS
            - name: KAFKA_CREATE_TOPICS
              value: "true"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: REDIS_PORT
            - name: REDIS_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: REDIS_USERNAME
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: corporate-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_USE_TLS
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: REDIS_USE_TLS
            - name: EMAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: EMAIL_HOST
            - name: EMAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: EMAIL_PORT
            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: corporate-secrets
                  key: EMAIL_USER
            - name: EMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: corporate-secrets
                  key: EMAIL_PASS
          volumeMounts:
            - name: kafka-ca
              mountPath: /app/certs
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: kafka-ca
          secret:
            secretName: kafka-ca-cert

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: corporatechat
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
  type: ClusterIP

