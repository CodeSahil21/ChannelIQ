apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: corporatechat
  labels:
    app: media-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
    spec:
      containers:
        - name: media-service
          image: ravencraft568/media-service:v26
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: NODE_ENV
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: corporate-secrets
                  key: JWT_SECRET
            - name: KAFKA_CLIENT_ID
              value: "media-service"
            - name: KAFKA_CONSUMER_GROUP_ID
              value: "media-service-group"
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: KAFKA_BROKER
            - name: KAFKA_USE_SSL
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: KAFKA_USE_SSL
            - name: KAFKA_SSL_CA_PATH
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: KAFKA_SSL_CA_PATH
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: corporate-secrets
                  key: KAFKA_USERNAME
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: corporate-secrets
                  key: KAFKA_PASSWORD
            - name: KAFKA_REPLICATION_FACTOR
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: KAFKA_REPLICATION_FACTOR
            - name: KAFKA_MEDIA_EVENTS_PARTITIONS
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: KAFKA_MEDIA_EVENTS_PARTITIONS
            - name: KAFKA_CREATE_TOPICS
              value: "false"
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: corporate-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: corporate-secrets
                  key: SUPABASE_ANON_KEY
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: corporate-secrets
                  key: SUPABASE_SERVICE_ROLE_KEY
            - name: SUPABASE_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: SUPABASE_BUCKET_NAME
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: REDIS_PORT
            - name: REDIS_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: REDIS_USERNAME
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: corporate-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_USE_TLS
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: REDIS_USE_TLS
            - name: MAX_FILE_SIZE
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: MAX_FILE_SIZE
            - name: ALLOWED_MIME_TYPES
              valueFrom:
                configMapKeyRef:
                  name: corporate-config
                  key: ALLOWED_MIME_TYPES
          volumeMounts:
            - name: kafka-ca
              mountPath: /app/certs
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: kafka-ca
          secret:
            secretName: kafka-ca-cert

---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: corporatechat
spec:
  selector:
    app: media-service
  ports:
    - port: 3003
      targetPort: 3003
      protocol: TCP
  type: ClusterIP